<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDM Web Interface</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">SDM Web Interface</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-view="analysis">Analysis Setup</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-view="results">Results Viewer</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Analysis Setup View -->
    <div id="analysis-view" class="view active">
        <div class="container">
            <div class="settings-container">
                <h2>Analysis Setup</h2>
                
                <!-- Processing Mode -->
                <div class="form-group mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="batchMode">
                        <label class="form-check-label" for="batchMode">Batch Processing</label>
                    </div>
                </div>

                <!-- File Selection -->
                <div id="singleFileSelection">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="subid">Subject ID</label>
                                <input type="text" class="form-control" id="subid" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="datasetId">Dataset ID</label>
                                <input type="text" class="form-control" id="datasetId" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="batchFileSelection" style="display: none;">
                    <div class="form-group">
                        <label for="inputFolder">Input Folder</label>
                        <input type="text" class="form-control" id="inputFolder" required>
                    </div>
                </div>

                <!-- Settings Tabs -->
                <ul class="nav nav-tabs settings-tabs" id="settingsTabs" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="smooth-tab" data-bs-toggle="tab" href="#smooth" role="tab">Smooth & Impute</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="curve-tab" data-bs-toggle="tab" href="#curve" role="tab">Curve Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="day-tab" data-bs-toggle="tab" href="#day" role="tab">Day Analysis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="gaps-tab" data-bs-toggle="tab" href="#gaps" role="tab">Gaps & Non-wear</a>
                    </li>
                </ul>

                <div class="tab-content settings-tab-content">
                    <!-- Smooth & Impute Settings -->
                    <div class="tab-pane fade show active" id="smooth" role="tabpanel">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="resetTac">
                            <label class="form-check-label" for="resetTac">Reset TAC</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="medianSmooth">
                            <label class="form-check-label" for="medianSmooth">Median Smooth</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="imputeGaps">
                            <label class="form-check-label" for="imputeGaps">Impute Gaps</label>
                        </div>
                    </div>

                    <!-- Curve Analysis Settings -->
                    <div class="tab-pane fade" id="curve" role="tabpanel">
                        <div class="form-group">
                            <label for="curveThreshold">Curve Threshold</label>
                            <input type="number" class="form-control" id="curveThreshold" value="0.5">
                        </div>
                        <div class="form-group">
                            <label for="peripheryBufferBefore">Periphery Buffer Before</label>
                            <input type="number" class="form-control" id="peripheryBufferBefore" value="0">
                        </div>
                    </div>

                    <!-- Day Analysis Settings -->
                    <div class="tab-pane fade" id="day" role="tabpanel">
                        <div class="form-group">
                            <label for="dayStartHour">Day Start Hour</label>
                            <input type="number" class="form-control" id="dayStartHour" value="0">
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="makeGraphs">
                            <label class="form-check-label" for="makeGraphs">Make Graphs</label>
                        </div>
                    </div>

                    <!-- Gaps & Non-wear Settings -->
                    <div class="tab-pane fade" id="gaps" role="tabpanel">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="exportExcel">
                            <label class="form-check-label" for="exportExcel">Export to Excel</label>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-4">
                    <button class="btn btn-secondary" id="loadDefaults">Reset Defaults</button>
                    <button class="btn btn-primary" id="startProcessing">Start Processing</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Viewer View -->
    <div id="results-view" class="view">
        <div class="container">
            <div class="row">
                <!-- Study List -->
                <div class="col-md-4">
                    <div class="study-list">
                        <div class="list-group" id="studyList">
                            <!-- Studies will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- Study Details -->
                <div class="col-md-8">
                    <div id="studyDetails" class="study-details">
                        <!-- Study details will be populated here -->
                    </div>

                    <!-- Results Tabs -->
                    <ul class="nav nav-tabs results-tabs" id="resultsTabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="day-results-tab" data-bs-toggle="tab" href="#day-results" role="tab">Day Results</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="curve-results-tab" data-bs-toggle="tab" href="#curve-results" role="tab">Curve Results</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="event-results-tab" data-bs-toggle="tab" href="#event-results" role="tab">Event Results</a>
                        </li>
                    </ul>

                    <div class="tab-content results-tab-content">
                        <div class="tab-pane fade show active" id="day-results" role="tabpanel">
                            <!-- Day results will be populated here -->
                        </div>
                        <div class="tab-pane fade" id="curve-results" role="tabpanel">
                            <!-- Curve results will be populated here -->
                        </div>
                        <div class="tab-pane fade" id="event-results" role="tabpanel">
                            <!-- Event results will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Processing...</p>
    </div>

    <!-- Error Message -->
    <div class="alert alert-danger" role="alert">
        <!-- Error messages will be shown here -->
    </div>

    <!-- Success Message -->
    <div class="alert alert-success" role="alert">
        <!-- Success messages will be shown here -->
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
